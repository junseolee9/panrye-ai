[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panrye"
version = "1.0.0"
description = "한국 판례 기반 법률 상담 RAG — LangGraph 멀티 에이전트 파이프라인"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["panrye"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
